<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея боссов</title>
    <style>
        /* Инструмент разработки: npm run dev → http://localhost:5183/tools/boss-gallery.html
           ?one=BOAR_BRIGADE — один крупно, ?q=low|medium|high — качество, ?armor=0 — без брони */
        :root { color-scheme: dark; }
        body { margin: 0; background: #14121a; color: #eee; font: 13px system-ui, sans-serif; overflow: hidden; }
        .lbl { position: fixed; transform: translate(-50%, 0); pointer-events: none; font-weight: 600; text-shadow: 0 1px 3px #000; font-size: 11px; white-space: nowrap; }
    </style>
</head>
<body>
<script type="module">
    import * as THREE from 'three';
    window.THREE = THREE;
    const q = new URLSearchParams(location.search);
    window.__lastQuality = q.get('q') || 'medium';
    const { createArcadeBossMesh, CAMPAIGN_BOSSES } = await import('../src/boss.js');
    const one = q.get('one');
    const yaw = parseFloat(q.get('yaw') || '0.35');
    const from = +(q.get('from') || 0), cnt = +(q.get('n') || 99);
    const defs = one ? CAMPAIGN_BOSSES.filter(b => b.id === one) : CAMPAIGN_BOSSES.slice(from, from + cnt);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(2, devicePixelRatio));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8a7355);
    scene.add(new THREE.AmbientLight(0xb0a090, 0.95));
    scene.add(new THREE.HemisphereLight(0xffe8c8, 0x6a5a40, 0.95));
    const sun = new THREE.DirectionalLight(0xfff0d0, 2.85); sun.position.set(40, 35, 15); scene.add(sun);
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 40), new THREE.MeshLambertMaterial({ color: 0x3a3a40 }));
    ground.rotation.x = -Math.PI / 2; scene.add(ground);

    const cols = one ? 1 : +(q.get('cols') || 6);
    const items = defs.map((def, i) => {
        const g = createArcadeBossMesh(def);
        const sc = (def.scale || 2.15) * 1.05;
        g.scale.setScalar(sc);
        const c = i % cols, r = Math.floor(i / cols);
        g.position.set((c - (cols - 1) / 2) * 3.6, 0, -r * 7);
        g.rotation.y = yaw;
        if (q.get('armor') === '0' && g.userData.armor) { g.userData.armor.shoulders.forEach(p => p.visible = false); g.userData.armor.chest.visible = false; }
        scene.add(g);
        const lbl = document.createElement('div'); lbl.className = 'lbl'; lbl.textContent = def.name; document.body.appendChild(lbl);
        return { g, lbl };
    });
    const camera = new THREE.PerspectiveCamera(one ? 30 : 38, innerWidth / innerHeight, 0.1, 200);
    if (one) { camera.position.set(0, 3.2, 9); camera.lookAt(0, 2.6, 0); }
    else { camera.position.set(0, 5.5, 13); camera.lookAt(0, 2.2, -7); }
    const v = new THREE.Vector3();
    renderer.render(scene, camera);
    items.forEach(it => {
        v.copy(it.g.position); v.project(camera);
        it.lbl.style.left = ((v.x + 1) / 2 * innerWidth) + 'px';
        it.lbl.style.top = ((1 - v.y) / 2 * innerHeight + 6) + 'px';
    });
    window.__galleryReady = true;
</script>
</body>
</html>
